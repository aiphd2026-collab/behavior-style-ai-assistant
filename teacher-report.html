<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>辅导教师版个人报告｜行为风格与兴趣发展AI助理</title>
  <style>
    :root{--ink:#25343b;--muted:#68777c;--paper:#fffdf9;--sand:#f7eadc;--coral:#c55c45;--blue:#3f7da4;--green:#438d76;--gold:#d49b29;--violet:#8165a2;--line:#e7d8cd}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(135deg,#f5e5d8,#eaf3ef);font-size:18px;line-height:1.75}
    button,input{font:inherit}.page{width:min(1120px,100%);margin:auto;padding:20px}.shell{overflow:hidden;border:1px solid #ddcbbd;border-radius:28px;background:var(--paper);box-shadow:0 22px 60px #745c4930}
    .hero{padding:40px;background:linear-gradient(135deg,#9f493c,#d78250);color:white}.hero small{display:inline-block;padding:6px 14px;border-radius:999px;background:#fff1;font-weight:800}.hero h1{margin:14px 0 4px;font-size:clamp(2rem,5vw,3.4rem);line-height:1.2}.hero p{margin:0;max-width:760px}
    .body{padding:34px}.lookup{padding:24px;border:1px solid var(--line);border-radius:22px;background:#fff7ef}.lookup h2{margin:0 0 14px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:14px 16px;border:2px solid #ddcfc5;border-radius:14px;background:white}.field input:focus{outline:3px solid #eab09a66;border-color:var(--coral)}
    .primary{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--coral),#dc8653);color:white;font-weight:900;cursor:pointer}.primary:disabled{opacity:.55;cursor:not-allowed}.message{margin-top:14px;padding:12px 15px;border-radius:12px;background:#fff0e5;color:#8b432f;font-weight:800}.hidden{display:none!important}
    .report{margin-top:24px}.report-head{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:28px;align-items:center;padding:28px 30px;border:1px solid #c9e1d7;border-radius:22px;background:linear-gradient(135deg,#edf7f2,#f9fcfa);border-left:8px solid var(--green)}.report-title{min-width:0}.report-label{display:inline-flex;padding:5px 12px;border-radius:999px;background:#dcefe7;color:#286653;font-size:.88rem;font-weight:900}.student-name{margin:12px 0 4px;font-size:clamp(1.8rem,3.4vw,2.55rem);line-height:1.18;color:#244d41;overflow-wrap:anywhere}.style-name{margin:0;color:#438d76;font-size:1.15rem;font-weight:900}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:var(--ink)}.meta-item{min-width:0;padding:11px 13px;border:1px solid #d6e5df;border-radius:13px;background:#ffffffcc}.meta-label{display:block;margin-bottom:2px;color:var(--muted);font-size:.78rem;font-weight:800}.meta-value{display:block;font-size:.96rem;font-weight:900;line-height:1.35;overflow-wrap:anywhere}
    .summary{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:20px;margin-top:18px}.radar{padding:18px;border:1px solid var(--line);border-radius:20px;background:white}.radar canvas{width:100%;height:auto}.overview{padding:24px;border-radius:20px;background:#fff0e6;border:1px solid #ecc4b3}.overview h3{margin-top:0;color:#8f4033}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{padding:22px;border-radius:18px;border:1px solid var(--line);background:white}.card h3{margin:0 0 8px;font-size:1.35rem}.card:nth-child(1){background:#eef7f3;border-left:6px solid var(--green)}.card:nth-child(2){background:#eef5fa;border-left:6px solid var(--blue)}.card:nth-child(3){background:#fff6dc;border-left:6px solid var(--gold)}.card:nth-child(4){background:#f2edf8;border-left:6px solid var(--violet)}
    .questions,.plan{margin-top:16px;padding:22px;border-radius:18px}.questions{background:#f1f6f8;border-left:7px solid var(--blue)}.plan{background:#fbe8df;border-left:7px solid var(--coral)}.questions h3,.plan h3{margin-top:0}.questions li{margin:8px 0}.boundary{margin-top:18px;padding:16px;border-radius:14px;background:#edf1ef;color:#53605b}.tools{display:flex;gap:12px;margin-top:16px}.secondary{padding:11px 18px;border:2px solid var(--coral);border-radius:12px;background:white;color:var(--coral);font-weight:900;cursor:pointer}
    @media(max-width:720px){body{font-size:17px}.page{padding:8px}.shell{border-radius:20px}.hero{padding:28px 20px}.body{padding:20px 15px}.fields,.summary,.grid{grid-template-columns:1fr}.report-head{grid-template-columns:1fr;gap:18px;padding:22px 18px}.student-name{font-size:1.85rem}.style-name{font-size:1.05rem}.meta{grid-template-columns:1fr 1fr;gap:8px}.meta-item{padding:10px}.meta-value{font-size:.9rem}}
    @media print{body{background:white}.page{width:100%;padding:0}.shell{box-shadow:none;border:0}.lookup,.tools{display:none}.report{margin-top:0}}
  </style>
</head>
<body>
<main class="page"><article class="shell">
  <header class="hero">
    <small>辅导处教师专用 · 演示版</small>
    <h1>行为风格个人辅导报告</h1>
    <p>读取学生最新一次有效作答，整理观察重点、辅导提问与两周支持建议。</p>
  </header>
  <div class="body">
    <section class="lookup">
      <h2>查询学生报告</h2>
      <div class="fields">
        <div class="field"><label for="studentName">学生姓名</label><input id="studentName" autocomplete="off" placeholder="请输入姓名"></div>
        <div class="field"><label for="className">班级</label><input id="className" autocomplete="off" placeholder="例如初二A班"></div>
      </div>
      <button id="queryButton" class="primary">读取教师版报告</button>
      <div id="message" class="message hidden"></div>
    </section>

    <section id="report" class="report hidden">
      <div class="report-head">
        <div class="report-title">
          <span class="report-label">辅导教师版</span>
          <h2 id="studentNameTitle" class="student-name"></h2>
          <p id="typeName" class="style-name"></p>
        </div>
        <div id="meta" class="meta"></div>
      </div>
      <div class="summary">
        <div class="radar"><canvas id="radar" width="560" height="500" aria-label="四维行为风格雷达图"></canvas></div>
        <section class="overview"><h3>综合解读</h3><p id="overview"></p></section>
      </div>
      <div class="grid">
        <section class="card"><h3>优势资源</h3><p id="strengths"></p></section>
        <section class="card"><h3>对学习的可能影响</h3><p id="learningImplications"></p></section>
        <section class="card"><h3>建议观察重点</h3><p id="observationFocus"></p></section>
        <section class="card"><h3>教师支持策略</h3><p id="supportStrategy"></p></section>
      </div>
      <section class="questions"><h3>辅导对话建议</h3><ol id="conversationQuestions"></ol></section>
      <section class="plan"><h3>两周跟进方案</h3><p id="followupPlan"></p></section>
      <p id="boundary" class="boundary"></p>
      <div class="tools"><button class="secondary" onclick="window.print()">打印或另存为PDF</button><button class="secondary" onclick="location.reload()">查询另一名学生</button></div>
    </section>
  </div>
</article></main>
<script>
  "use strict";
  const API_URL="https://script.google.com/macros/s/AKfycbz4NDgCUkRpdSL09j8QtGl4TU3uXv6148o7mRB8DP9KjCZw4FQG-1SUlv_LCZcoGzoK/exec";
  const $=id=>document.getElementById(id);
  const esc=value=>String(value??"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
  function showMessage(text){$("message").textContent=text;$("message").classList.remove("hidden")}

  $("queryButton").addEventListener("click",async()=>{
    $("message").classList.add("hidden");$("report").classList.add("hidden");
    const payload={action:"teacherReport",studentName:$("studentName").value.trim(),className:$("className").value.trim()};
    if(!payload.studentName||!payload.className)return showMessage("请完整填写学生姓名及班级");
    const button=$("queryButton");button.disabled=true;button.textContent="正在读取最新有效报告……";
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
    try{
      const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams(payload),signal:controller.signal}).then(r=>r.json());
      if(!response.success)throw new Error(response.message||"暂时无法读取教师版报告");
      renderReport(response.report);$("report").classList.remove("hidden");$("report").scrollIntoView({behavior:"smooth"});
    }catch(err){showMessage(err.name==="AbortError"?"连接时间较长，请检查网络后重新尝试":err.message||"暂时无法读取教师版报告")}
    finally{clearTimeout(timer);button.disabled=false;button.textContent="读取教师版报告"}
  });

  function renderReport(report){
    $("studentNameTitle").textContent=report.studentName;
    $("typeName").textContent="行为风格："+report.typeName;
    $("meta").innerHTML=[
      ["班级",report.className],
      ["测试日期",formatDate(report.testDate)],
      ["有效作答","第"+report.submissionNo+"次"],
      ["报告版本","辅导教师版"]
    ].map(item=>'<div class="meta-item"><span class="meta-label">'+esc(item[0])+'</span><span class="meta-value">'+esc(item[1])+'</span></div>').join("");
    ["overview","strengths","learningImplications","observationFocus","supportStrategy","followupPlan","boundary"].forEach(key=>$(key).textContent=report[key]||"");
    $("conversationQuestions").innerHTML=(report.conversationQuestions||[]).map(item=>"<li>"+esc(item)+"</li>").join("");
    const labels=Object.keys(report.scores),values=labels.map(label=>Number(report.scores[label])),max=Math.max(10,...values);
    drawRadar($("radar"),labels,values,max);
  }
  function formatDate(value){
    const date=new Date(value);
    if(Number.isNaN(date.getTime()))return String(value||"").replace(/T.*$/,"");
    return new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"long",day:"numeric"}).format(date);
  }
  function drawRadar(canvas,labels,values,max){
    const ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height,cx=w/2,cy=h/2+8,r=150;
    ctx.clearRect(0,0,w,h);ctx.font='700 22px "Microsoft YaHei"';ctx.textAlign="center";ctx.textBaseline="middle";
    for(let level=1;level<=4;level++){ctx.beginPath();for(let i=0;i<4;i++){const a=-Math.PI/2+i*Math.PI/2,rr=r*level/4,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle="#d9d1cb";ctx.lineWidth=2;ctx.stroke()}
    for(let i=0;i<4;i++){const a=-Math.PI/2+i*Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.strokeStyle="#d9d1cb";ctx.stroke();const lr=r+60;ctx.fillStyle="#38454d";ctx.fillText(labels[i]+" "+values[i],cx+Math.cos(a)*lr,cy+Math.sin(a)*lr)}
    ctx.beginPath();values.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI/2,rr=r*Math.min(v,max)/max,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle="#438d7644";ctx.fill();ctx.strokeStyle="#347962";ctx.lineWidth=5;ctx.stroke();
    values.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI/2,rr=r*Math.min(v,max)/max,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#347962";ctx.lineWidth=4;ctx.stroke()});
  }
</script>
</body>
</html>
