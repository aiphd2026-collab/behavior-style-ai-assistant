<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>行为风格班级分析｜辅导教师版</title>
  <style>
    :root{--ink:#263238;--muted:#65736f;--paper:#fffdf8;--cream:#fff5e8;--coral:#cf654b;--gold:#e6a72c;--blue:#4d83a8;--green:#4f9078;--line:#ead8c8}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8e5d6,#e3f1ec);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;line-height:1.65}
    main{max-width:1180px;margin:28px auto;padding:0 18px 60px}.hero,.panel{background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 45px rgba(83,61,45,.1)}
    .hero{padding:34px;background:linear-gradient(135deg,#a94e3c,#d97b56 60%,#e7a158);color:#fff}.eyebrow{font-weight:800;letter-spacing:.08em}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.1;margin:12px 0}.hero p{margin:0;max-width:800px}.query{display:grid;grid-template-columns:1fr auto;gap:14px;margin-top:28px}.query input,.query button{border:0;border-radius:16px;padding:16px 18px;font:inherit}.query input{background:#fff;color:var(--ink)}.query button{background:#ffe1a0;color:#67351f;font-weight:900;cursor:pointer}.notice{margin-top:14px;min-height:28px}
    #report{display:none}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card,.panel{padding:24px}.card{border-radius:22px;color:#fff}.card:nth-child(1){background:var(--coral)}.card:nth-child(2){background:var(--green)}.card:nth-child(3){background:var(--blue)}.card:nth-child(4){background:var(--gold);color:#4f3610}.num{display:block;font-size:38px;font-weight:950;line-height:1.2}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{position:relative;overflow:hidden}.panel h2{margin:0 0 14px;font-size:27px}.panel h3{margin:20px 0 8px;padding:8px 12px;border-radius:12px;font-size:19px}.radar-wrap{display:grid;place-items:center}.radar{width:min(100%,430px);height:auto}.bars{display:grid;gap:13px}.barline{display:grid;grid-template-columns:130px 1fr 74px;gap:12px;align-items:center}.track{height:18px;background:#eee5dc;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:99px}.tag{display:inline-block;padding:6px 12px;border-radius:999px;background:#dff1e9;color:#27624f;font-weight:800}.list{padding-left:1.3em}.list li{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.72);border-left:4px solid currentColor}.chart-coral{border-top:8px solid var(--coral);background:linear-gradient(180deg,#fff8f3,#fffdf8)}.chart-gold{border-top:8px solid var(--gold);background:linear-gradient(180deg,#fff9e9,#fffdf8)}.insight{border-top:8px solid var(--coral);background:linear-gradient(145deg,#fff2eb,#fffaf5)}.insight h2{color:#a74432}.insight h3{color:#9b4636;background:#f8ded3}.support{border-top:8px solid var(--blue);background:linear-gradient(145deg,#edf6fb,#f8fcfe)}.support h2{color:#315f80}.support h2+ol+ h2{margin-top:26px;padding-top:20px;border-top:1px solid #bad4e4}.support .list{color:#315f80}.support .list li::marker{color:var(--blue);font-weight:900}.action-plan{border-top:8px solid var(--gold);background:linear-gradient(135deg,#fff6d9,#fffaf0)}.action-plan h2{color:#815810}.action-plan .list{color:#815810}.action-plan .list li::marker{color:var(--gold);font-weight:900}.boundary{border-left:8px solid var(--green);border-top:1px solid #b8d8cc;background:linear-gradient(135deg,#e5f4ee,#f5fbf8)}.boundary h2{color:#2d6a55}.actions{margin-top:20px;text-align:right}.actions button{padding:12px 18px;border:1px solid var(--line);background:#fff;border-radius:14px;font:inherit;font-weight:800;cursor:pointer}
    @media(max-width:760px){body{font-size:17px}.hero{padding:25px 20px}.query,.summary,.grid2{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.barline{grid-template-columns:105px 1fr 56px}.panel{padding:20px}}
    @media print{body{background:#fff}main{margin:0;max-width:none}.query,.notice,.actions{display:none}.hero,.panel{box-shadow:none;break-inside:avoid}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div class="eyebrow">辅导教师版 · 班级教育观察</div>
    <h1>行为风格班级分析</h1>
    <p>依据每名学生最新一次完整且有效的作答，了解班级行为资源、学习倾向与合作差异，并转化为可执行的两周支持方案。</p>
    <form class="query" id="queryForm">
      <input id="className" autocomplete="off" placeholder="班级，例如：初二A班" required>
      <button type="submit">读取班级分析</button>
    </form>
    <div class="notice" id="notice"></div>
  </section>

  <div id="report">
    <section class="summary" id="summary"></section>
    <section class="grid2">
      <article class="panel chart-coral"><h2>四维平均</h2><div class="radar-wrap" id="radar"></div></article>
      <article class="panel chart-gold"><h2>类型分布</h2><div class="bars" id="typeBars"></div></article>
    </section>
    <section class="grid2">
      <article class="panel insight"><h2>班级主要发现</h2><span class="tag" id="diversity"></span><h3>整体观察</h3><p id="dominant"></p><h3>对当前学习的可能影响</h3><p id="learning"></p><h3>对合作的可能影响</h3><p id="collaboration"></p></article>
      <article class="panel support"><h2>全班支持策略</h2><ol class="list" id="strategies"></ol><h2>分组与角色建议</h2><ul class="list" id="groups"></ul></article>
    </section>
    <section class="panel action-plan" style="margin-top:18px"><h2>两周行动方案</h2><ol class="list" id="plan"></ol></section>
    <section class="panel boundary" style="margin-top:18px"><h2>使用边界</h2><p id="limitations"></p></section>
    <div class="actions"><button onclick="window.print()">打印或另存为PDF</button></div>
  </div>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbz4NDgCUkRpdSL09j8QtGl4TU3uXv6148o7mRB8DP9KjCZw4FQG-1SUlv_LCZcoGzoK/exec';
const dims=['行动推动','沟通影响','稳定支持','规则分析'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('queryForm').addEventListener('submit',async e=>{
  e.preventDefault(); const notice=document.getElementById('notice'); notice.textContent='正在读取真实班级数据，请稍候……';
  const body=new URLSearchParams({action:'classReport',className:document.getElementById('className').value});
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
  try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body,signal:controller.signal});const data=await res.json();if(!data.success)throw new Error(data.message||'读取失败');render(data.report);notice.textContent='资料读取完成。';}
  catch(err){notice.textContent=err.name==='AbortError'?'连接超时，请稍后再试':err.message;document.getElementById('report').style.display='none';}
  finally{clearTimeout(timer)}
});
function render(r){
  document.getElementById('report').style.display='block';
  document.getElementById('summary').innerHTML=[['班级',r.className],['有效样本',r.validCount+'人'],['完成率',r.completionRate+'%'],['类型特点',r.diversityLevel]].map(x=>`<div class="card"><small>${esc(x[0])}</small><span class="num">${esc(x[1])}</span></div>`).join('');
  document.getElementById('radar').innerHTML=radarSvg(r.averages);
  document.getElementById('typeBars').innerHTML=r.typeDistribution.map(x=>`<div class="barline"><strong>${esc(x.typeName)}</strong><div class="track"><div class="fill" style="width:${Math.min(100,x.percentage)}%"></div></div><span>${x.count}人<br>${x.percentage}%</span></div>`).join('');
  setText('diversity',r.diversityLevel);setText('dominant',r.dominantSummary);setText('learning',r.learningImplications);setText('collaboration',r.collaborationImplications);setText('limitations',r.limitations);
  list('strategies',r.wholeClassStrategies);list('groups',r.groupingSuggestions);list('plan',r.twoWeekPlan);
  document.getElementById('report').scrollIntoView({behavior:'smooth',block:'start'});
}
function setText(id,v){document.getElementById(id).textContent=v||''}function list(id,arr){document.getElementById(id).innerHTML=(arr||[]).map(x=>`<li>${esc(x)}</li>`).join('')}
function radarSvg(scores){const cx=220,cy=205,R=135,max=12,angles=[-Math.PI/2,0,Math.PI/2,Math.PI],point=(i,r)=>[cx+Math.cos(angles[i])*r,cy+Math.sin(angles[i])*r];let grid='';[.25,.5,.75,1].forEach(k=>{grid+=`<polygon points="${[0,1,2,3].map(i=>point(i,R*k).join(',')).join(' ')}" fill="none" stroke="#d9c9bb"/>`});const pts=dims.map((d,i)=>point(i,R*Math.min(max,Number(scores[d]||0))/max).join(',')).join(' ');const labels=[`<text x="220" y="32" text-anchor="middle">行动推动 ${scores['行动推动']}</text>`,`<text x="392" y="210" text-anchor="end">沟通影响 ${scores['沟通影响']}</text>`,`<text x="220" y="388" text-anchor="middle">稳定支持 ${scores['稳定支持']}</text>`,`<text x="48" y="210">规则分析 ${scores['规则分析']}</text>`].join('');return `<svg class="radar" viewBox="0 0 440 410" role="img" aria-label="四维平均雷达图">${grid}<line x1="220" y1="70" x2="220" y2="340" stroke="#d9c9bb"/><line x1="85" y1="205" x2="355" y2="205" stroke="#d9c9bb"/><polygon points="${pts}" fill="rgba(207,101,75,.28)" stroke="#cf654b" stroke-width="4"/>${dims.map((d,i)=>{const p=point(i,R*Math.min(max,Number(scores[d]||0))/max);return `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#fff" stroke="#cf654b" stroke-width="4"/>`}).join('')}<g font-size="17" font-weight="800" fill="#263238">${labels}</g></svg>`}
</script>
</body>
</html>
